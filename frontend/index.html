<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Draft</title>
    <script src="script.js" defer></script>
      <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page" id="join_create">
        <button onclick="openDraft(
            document.getElementById('openDraftInput').value,
            document.getElementById('openUserNameInput').value,
        )">Open Draft</button>
        <input id="openDraftInput" placeholder="Draft key">
        <input id="openUserNameInput" placeholder="User name">
        <button onclick="joinDraft(
          document.getElementById('draftKeyInput').value,
          document.getElementById('userNameInput').value
        )">Join Draft</button>
        <input id="draftKeyInput" placeholder="Draft key">
        <input id="userNameInput" placeholder="User name">
        <p id="joinResults"></p>
    </div>
    <div class="page" id="waitingRoom">
        <p>Waiting For Draft</p>
        <button id="startDraftButton" onclick="startDraft()">Start Draft</button>
    </div>
    <div class="page" id="draftPage">
        <nav>
            <button onclick="goToMyPlayers()">My Players</button>
            <button onclick="goToDraftBoard()">Draft Board</button>
            <button onclick="goToPicks()">Picks</button>
        </nav>
        <div class="draftPage" id="userPlayers">
            userPlayers
        </div>
        <div class="draftPage" id="draftBoard">
            <input id="nameInput" placeholder="enter name">
            <input id="positionInput" placeholder="enter position">
            <input id="teamInput" placeholder="enter team">
            <button onclick="sendPick(
                document.getElementById('teamInput').value,
                document.getElementById('positionInput').value,
                document.getElementById('nameInput').value,
            )">
                add pick
            </button>
        </div>
        <div class="draftPage" id="picksBoard">
            pick board
        </div>
    </div>
</body>
</html>
